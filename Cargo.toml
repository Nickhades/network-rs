[workspace]
members = [
    "crates/nm-common",
    "crates/nm-freebsd-daemon",
    "crates/nm-dhcp-notify",
    "crates/nm-freebsd-cli",
    "crates/nm-xfce-plugin",
]
default-members = ["crates/nm-freebsd-daemon"]
resolver = "2"

[workspace.package]
version = "0.2.10"
edition = "2024"
rust-version = "1.95"
license = "BSD-2-Clause"
repository = "https://github.com/Nickhades/network-rs"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
libc = "0.2"
nm-common = { path = "crates/nm-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "signal", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
zbus = { version = "6.5", default-features = false, features = ["tokio", "proxy", "service"] }

[profile.release]
lto = "thin"
strip = true
panic = "abort"
