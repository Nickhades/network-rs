<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the NetworkManager name. -->
  <policy user="root">
    <allow own="org.freedesktop.NetworkManager"/>
    <allow send_destination="org.freedesktop.NetworkManager"/>
    <allow receive_sender="org.freedesktop.NetworkManager"/>
  </policy>

  <policy context="default">
    <deny own="org.freedesktop.NetworkManager"/>
    <!-- Desktop frontends and the XFCE plugin need to call and observe the
         service. On a single-user workstation this is intentional. To require
         a privileged group instead, replace these two allows with:
           <policy group="wheel"> ... </policy>
         and note that the interactive desktop user must then be in wheel. -->
    <allow send_destination="org.freedesktop.NetworkManager"/>
    <allow receive_sender="org.freedesktop.NetworkManager"/>
  </policy>
</busconfig>
