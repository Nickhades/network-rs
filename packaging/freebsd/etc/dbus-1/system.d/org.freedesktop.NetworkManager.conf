<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    nm-freebsd D-Bus policy.

    Full control: root, and members of the wheel or network group.
    Read-only: all other local users can query manager/device/AP properties,
    list settings without secrets, and request a scan. Every mutating method
    is also checked against the caller's uid in the daemon.

    To delegate control to a desktop user without adding wheel:
        pw groupmod network -m <user>
    That user must log out and back in before the group change takes effect.
  -->

  <policy user="root">
    <allow own="org.freedesktop.NetworkManager"/>
    <allow send_destination="org.freedesktop.NetworkManager"/>
    <allow receive_sender="org.freedesktop.NetworkManager"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="org.freedesktop.NetworkManager"/>
    <allow receive_sender="org.freedesktop.NetworkManager"/>
  </policy>

  <policy group="network">
    <allow send_destination="org.freedesktop.NetworkManager"/>
    <allow receive_sender="org.freedesktop.NetworkManager"/>
  </policy>

  <policy context="default">
    <deny own="org.freedesktop.NetworkManager"/>

    <!-- Read-only object access. -->
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.DBus.Peer"/>

    <!-- Manager queries available to unprivileged desktop users. -->
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager"
           send_member="GetDevices"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager"
           send_member="GetAllDevices"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager"
           send_member="GetDeviceByIpIface"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager"
           send_member="CheckConnectivity"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager"
           send_member="GetPermissions"/>

    <!-- Owner/admin authorization is enforced in the daemon. -->
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager"
           send_member="ActivateConnection"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager"
           send_member="AddAndActivateConnection"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager"
           send_member="AddAndActivateConnection2"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager"
           send_member="DeactivateConnection"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager.Device"
           send_member="Disconnect"/>

    <!-- AP discovery is read-only from the user's point of view. -->
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager.Device.Wireless"
           send_member="GetAccessPoints"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager.Device.Wireless"
           send_member="GetAllAccessPoints"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager.Device.Wireless"
           send_member="RequestScan"/>

    <!-- Saved connection metadata, not secrets. -->
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager.Settings"
           send_member="ListConnections"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager.Settings"
           send_member="GetConnection"/>
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager.Settings.Connection"
           send_member="GetSettings"/>
    <!-- The daemon checks owner-uid/admin; the bus lets the call reach it. -->
    <allow send_destination="org.freedesktop.NetworkManager"
           send_interface="org.freedesktop.NetworkManager.Settings.Connection"
           send_member="GetSecrets"/>

    <allow receive_sender="org.freedesktop.NetworkManager"/>
  </policy>
</busconfig>
